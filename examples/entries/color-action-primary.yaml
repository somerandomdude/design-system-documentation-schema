id: color.action.primary
kind: token
name: Action Primary
description: The fill color for high-emphasis interactive surfaces.

tokenType: color

# must: an exhaustive allowlist - this fill color has only been
# contrast-tested against these two surfaces, so anything else is
# implicitly denied.
combos:
  - subject: "{color.action.primary}"
    level: must
    items: ["{color.surface.default}", "{color.surface.raised}"]
    note: Contrast is verified only against these surfaces; on any other background the label ratio is unproven.

metadata:
  status: {status: stable}
  since: 1.0.0
  tags: [color, action, primary]
  group: color.action

refs:
  - to: color.action.primary.hover
    rel: relates-to
  - href: ./tokens.dtcg.json
    rel: file
    role: color.action.primary.*


sections:
  - kind: guidelines
    for: all
    items:
      - statement: Use for the single primary call-to-action on a surface.
        level: should
      - statement: Do not apply to destructive actions - use color.action.danger instead.
        level: must-not
