id: link
kind: component
name: Link
description: Navigates to a new URL, page, or section. Renders as inline or standalone text.

metadata:
  status: {status: stable}
  since: 1.0.0
  tags: [actions, navigation]

sections:
  - kind: guidelines
    for: all
    items:
      - statement: Use link when the action navigates somewhere; use button for in-page actions and state changes.
        level: must
      - statement: Always pair link color with an underline for inline links within body text.
        level: must
        evidence:
          - href: https://www.w3.org/WAI/WCAG21/Understanding/use-of-color.html
            rel: external-link
