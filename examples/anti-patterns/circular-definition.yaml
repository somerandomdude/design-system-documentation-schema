# Valid but wrong: nothing in the schema can require a definition to say
# more than its own term. This passes every check DSDS runs and still
# tells a reader nothing they didn't already know from the word itself.
id: tooltip
kind: entry
name: Tooltip
description: A small popup that shows extra information.
sections:
  - kind: definitions
    for: all
    context: terms
    items:
      - term: Hover state
        definition: The state the tooltip is in when you hover over it.
      - term: Dismiss
        definition: Dismissing the tooltip.
