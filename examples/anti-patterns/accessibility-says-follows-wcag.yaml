kind: component
# Valid but wrong: `evidence` (rel: external-link) is the field built to
# tie an accessibility rule to the specific WCAG criterion it follows,
# and `checks` (rel: test) is the field built to point at the test that
# proves it, yet the guidelines item schema requires neither (only
# `level` plus a `statement`). A bare "conforms to WCAG 2.1 AA"
# statement therefore validates with no criterion named and no test
# attached, so a developer reading it learns that the author claimed
# conformance but not which of the dozens of success criteria to verify.
id: modal
name: Modal
description: A dialog that overlays the page and holds focus until it is dismissed.
sections:
  - kind: guidelines
    for: human
    items:
      - level: must
        statement: The modal conforms to WCAG 2.1 Level AA.
