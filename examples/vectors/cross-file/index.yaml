# Processing model §3: every file in a project is one pool. This base document and
# button.yaml beside it resolve as one project, so `button`'s reuse of a shared rule and its
# `uses` ref both resolve, and a ref to an entry no file defines is a problem.
schemaVersion: "0.23.1"
name: Cross-file
entries:
  - kind: token
    id: color.action
    name: Action color
    description: The fill for actions.
    tokenType: color
shared:
  - id: shared-a11y
    name: Shared accessibility rules
    description: Rules every interactive component follows.
    sections:
      - kind: guidelines
        for: all
        items:
          - id: touch-target
            level: must
            statement: Make touch targets at least 44 by 44 pixels.
refs:
  - href: ./button.yaml
    rel: file
