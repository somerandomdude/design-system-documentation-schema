schemaVersion: "0.23.1"
# expect: DSDS-11
# rejectedBy: semantic
# The system's sourceRoot says sourceFiles paths start in ./src. This file
# names itself as the source: it exists next to this document, but not in
# ./src, so the warning shows sourceRoot was applied.
name: Bad Source Root
entries:
  - kind: system
    id: bad-source-root
    name: Bad Source Root
    description: A system whose code lives in a src folder.
    metadata:
      sourceRoot: ./src
  - kind: component
    id: card
    name: Card
    description: A component whose source path is read from the system's sourceRoot.
    sourceFiles:
      - platform: react
        file: DSDS-11-source-root.yaml
