# expect: DSDS-08
# rejectedBy: semantic
# errorAt: /entries/0/sections/0/items/0/statement
schemaVersion: "0.23.1"
name: Inline Link With A Malformed Target
entries:
  - kind: component
    id: button
    name: Button
    description: Triggers an action.
    sections:
      - kind: guidelines
        for: all
        items:
          # `variant..primary` has an empty part between the dots, so it isn't
          # shaped like a `to`. The schema can't see inside a string; DSDS-08 does.
          - level: should
            statement: Use [the primary variant](dsds:button#variant..primary) once per screen.
    traits:
      - traitType: variant
        kind: enum
        id: variant
        description: Fill and color.
        values:
          - id: primary
            description: The main action.
