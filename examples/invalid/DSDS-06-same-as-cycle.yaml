    id: one
    name: One
    description: Reuses two's rule.
    sections:
      - kind: guidelines
        for: all
        items:
          - id: rule
            refs:
              - to: two#rule
                rel: same-as
  - kind: entry
    id: two
    name: Two
    description: Reuses one's rule.
    sections:
      - kind: guidelines
        for: all
        items:
          - id: rule
            refs:
              - to: one#rule
                rel: same-as
