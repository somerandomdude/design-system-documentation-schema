schemaVersion: "0.20.0"

name: Pizza Party Design System

entries:
  - id: button
    kind: component
    name: Button
    description: Triggers an action.
    sections:
      - kind: guidelines
        for: all
        items:
          # No `statement` here — this item IS the "touch-target" rule
          # declared once on shared-a11y below, not a second copy of it.
          - level: must
            refs:
              - to: shared-a11y#touch-target
                rel: same-as

shared:
  - id: shared-a11y
    name: Shared Accessibility Rules
    description: Cross-cutting accessibility rules, stated once and referenced from every entry they apply to.
    sections:
      - kind: guidelines
        for: all
        items:
          - id: touch-target
            statement: Minimum touch target 44x44px.
            level: must
