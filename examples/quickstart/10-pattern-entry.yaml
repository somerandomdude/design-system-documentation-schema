id: empty-state
kind: entry
name: Empty State
description: A pattern shown in place of a list or grid that has no content yet.
purpose: Tells the user why an area is empty and what to do next, instead of leaving a blank surface.

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - statement: Use an empty state the first time a user visits a list or grid that has no content yet.
        level: should
