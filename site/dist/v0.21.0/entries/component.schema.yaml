$schema: https://json-schema.org/draft/2020-12/schema
$id: https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml
title: ComponentEntry
description: A reusable UI element, like a button or a dialog.
$comment: >-
  `traits`, `combos`, `imports`, `sourceFiles`, and `specs` live
  directly here rather than in a section, since they're facts about the
  component as a build artifact, not documentation content.
allOf:
  - $ref: https://designsystemdocspec.org/v0.21.0/entries/entry.schema.yaml
  - type: object
    properties:
      kind:
        const: component
        description: Marks this entry as a component.
      metadata:
        allOf:
          - $ref: https://designsystemdocspec.org/v0.21.0/metadata/entry-metadata.schema.yaml
        unevaluatedProperties: false
      sourceFiles:
        type: array
        minItems: 1
        description: One entry per platform's source file.
        $comment: >-
          Defining the source file in the schema enables a tool to
          extract the component's full API (properties, events, slots,
          CSS hooks) straight from the code. This avoids drift between
          docs and code. Points at raw source (e.g. `Button.tsx`) - a
          project whose tooling already generates a manifest *from* that
          source (a Custom Elements Manifest, or similar) points `specs`
          at the generated document itself instead of repeating the
          extraction here.
        items:
          type: object
          required: [platform, file]
          properties:
            platform:
              $ref: https://designsystemdocspec.org/v0.21.0/common/id.schema.yaml
              description: The platform or framework this interface applies to. When the document declares a `metadata.platforms` list, this MUST be one of its entries.
              example: react
            file:
              $ref: https://designsystemdocspec.org/v0.21.0/common/ref.schema.yaml
              description: Path to the component's source file.
              $comment: A bare string is a plain file path (shorthand for href). Use the full ref object when role or note matters.
              example: ./src/Button.tsx
          additionalProperties: false

      imports:
        type: array
        minItems: 1
        description: One entry per platform.
        $comment: List the primary platform first.
        items:
          type: object
          required: [platform, code]
          properties:
            platform:
              $ref: https://designsystemdocspec.org/v0.21.0/common/id.schema.yaml
              description: The platform this applies to. When the document declares a `metadata.platforms` list, this MUST be one of its entries.
              example: react
            code:
              type: string
              description: The import statement itself, written out.
              example: "import { Button } from '@acme/ui';"
            package:
              type: string
              description: The package to install, exactly as named in the package manager.
              example: "@acme/ui"
      specs:
        $ref: https://designsystemdocspec.org/v0.21.0/common/ref.schema.yaml#/$defs/list
        description: Machine-readable API contract(s) for this component (props, slots, events, etc.) in a standard, tool-readable format.
        $comment: >-
          `specs` is different from `sourceFiles`. This points at an already-extracted
          contract document. It could be a a Custom Elements Manifest
          (https://github.com/webcomponents/custom-elements-manifest, a DS Contracts
          document (https://github.com/southleft/ds-contracts-poc), or your own format.
          The property accepts entry per platform or format, if more than one exists; use
          `role` to name the format when it isn't obvious from the file extension.
        example:
          - href: ./contracts/button.contract.json
            rel: contract
            role: DS Contracts

      traits:
        type: array
        description: >-
          The component's variants and states. Every item says which
          one it is with `traitType`, and carries a `kind` of `boolean`
          or `enum` for the form it takes - an enum has its own
          `values` list, a boolean is a plain toggle.
        $comment: >-
          Two independent axes, deliberately. `kind` is the `anyOf`
          discriminator, because a boolean and an enum genuinely carry
          different fields - compare `sections/steps.schema.yaml`'s and
          `sections/guidelines.schema.yaml`'s own items, which stay one
          flexible form with no `kind` tag for exactly that reason.
          `traitType` is the taxonomy a reader wants, and both kinds
          can be either type: `hover` is a boolean state, `size` an
          enum variant.
        minItems: 1
        items:
          anyOf:
            - allOf:
                - $ref: "https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml#/$defs/traitValue"
                - type: object
                  required: [traitType, kind]
                  properties:
                    traitType:
                      $ref: "https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml#/$defs/traitType"
                    kind:
                      const: boolean
                      description: Marks this trait as a yes/no toggle.
                      $comment: >-
                        A boolean can be either `traitType` - an
                        `outlined` variant or a `hover` state are both
                        plain toggles. `kind` is only about the form
                        the value takes.
                    refs:
                      $ref: https://designsystemdocspec.org/v0.21.0/common/ref.schema.yaml#/$defs/list
                      description: "Pointers to resources for this trait: a design tool entry, a source file, or a verifying test."
              unevaluatedProperties: false
            - allOf:
                - $ref: "https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml#/$defs/traitValue"
                - type: object
                  required: [traitType, kind, values]
                  properties:
                    traitType:
                      $ref: "https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml#/$defs/traitType"
                    kind:
                      const: enum
                      description: Marks this trait as an enumerated configuration dimension.
                    id:
                      description: The machine-readable name for the dimension, for example 'size'.
                    name:
                      description: The human-readable name of the dimension, for example 'Size'.
                    description:
                      description: What this dimension of variation controls.
                    refs:
                      $ref: https://designsystemdocspec.org/v0.21.0/common/ref.schema.yaml#/$defs/list
                      description: "Pointers to resources for this dimension as a whole: a design tool entry, a source file, or a verifying test."
                    values:
                      type: array
                      minItems: 1
                      description: The possible values, in order. The first value is implied as the default.
                      $comment: Each value is a `traitValue`.
                      example:
                        - id: small
                          description: Compact size for dense layouts.
                        - id: medium
                          description: The default size for most surfaces.
                      items:
                        allOf:
                          - $ref: "https://designsystemdocspec.org/v0.21.0/entries/component.schema.yaml#/$defs/traitValue"
                        properties:
                          refs:
                            $ref: https://designsystemdocspec.org/v0.21.0/common/ref.schema.yaml#/$defs/list
                            description: "Pointers to resources for this specific value: a design tool entry, a source file, or a verifying test."
                        unevaluatedProperties: false
              unevaluatedProperties: false
      combos:
        type: array
        minItems: 1
        items:
          $ref: https://designsystemdocspec.org/v0.21.0/common/combo.schema.yaml
        description: Define which of this component's own boolean traits or enum values can or cannot be paired with each other.
        example:
          - subject: loading
            level: must-not
            items: [disabled]
            note: A control can't be simultaneously loading and disabled.
unevaluatedProperties: false
$defs:
  traitType:
    type: string
    enum: [variant, state]
    description: Whether this trait is a variant the caller configures, or a state the component can be in.
    $comment: >-
      `variant` is a dimension of configuration, like `size` or the
      `variant` trait itself. `state` is a condition the component is
      in, like `hover`, `loading` or `disabled`. Note that a state is
      not always something the component sets on its own - `disabled`
      and `loading` are states the caller turns on. Required.
  traitValue:
    type: object
    required: [id, description]
    description: The shared properties of a boolean trait or one enum value - what it is, and what it's for.
    $comment: >-
      The shared properties of boolean and enum traits. Contains all the details to describe
      a trait's value, what it is, and what it's for.
    properties:
      id:
        $ref: https://designsystemdocspec.org/v0.21.0/common/id.schema.yaml#/$defs/apiId
        description: The machine-readable id. Mirrors the real prop, attribute or value name, so it accepts camelCase, PascalCase, snake_case and kebab-case.
        example: isDisabled
      name:
        type: string
        description: The human-readable name. Uses `id` when left out.
        example: Loading
      description:
        $ref: https://designsystemdocspec.org/v0.21.0/common/markdown.schema.yaml
        description: What this is, how it looks or behaves, and any constraints.
        example: Shows a spinner in place of the label and blocks interaction while active.
      purpose:
        $ref: https://designsystemdocspec.org/v0.21.0/common/markdown.schema.yaml
        description: Why this exists.
        example: Prevents duplicate submissions while an action is in flight.
      examples:
        $ref: https://designsystemdocspec.org/v0.21.0/common/example.schema.yaml#/$defs/list
        description: Examples showing this in context.
      since:
        $ref: https://designsystemdocspec.org/v0.21.0/common/since.schema.yaml
        description: The version this was introduced.
