id: bad-ref-both
name: Bad Ref Both
description: An entry whose ref sets both `to` and `href` - the schema requires exactly one, since they point at two different kinds of target (inside this document vs. outside it).
refs:
  - to: some-other-entry
    href: https://example.com/thing
    rel: see-also
