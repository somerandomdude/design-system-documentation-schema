- id: DSDS-01
  name: ONE_API_PER_PLATFORM
  enforcement: semantic
  title: At most one `sourceFiles` entry per platform.
  description: >-
    A component cannot declare two `sourceFiles` entries for the same
    `platform` (or two with no `platform` at all) - a tool needs exactly
    one source file to extract each platform's interface from.

- id: DSDS-02
  name: PLATFORM_VOCABULARY
  enforcement: semantic
  title: "A system entry's `metadata.platforms` closes the platform vocabulary, once declared."
  description: >-
    When a `kind: system` entry declares `metadata.platforms`, every
    `platform` value used anywhere in the document must be one of them.
    This includes a component's own `sourceFiles` and `imports` entries,
    and a status entry.

- id: DSDS-03
  name: CHECKED_BY_NEEDS_REF
  enforcement: semantic
  title: "A `checkedBy: automated` rule needs somewhere to actually run."
  description: >-
    A guideline item that claims `automated` verification must carry at
    least one `refs` or `checks` entry with `rel: test` or `rel:
    lint-rule`. Otherwise, "automated" is just an unverifiable label, not
    a real connection to a check.

- id: DSDS-04
  name: UNIQUE_ENTRY_ID
  enforcement: semantic
  title: Entry and shared ids are unique within a document.
  description: >-
    `entries` and `shared` share one id and addressing space. An
    `entryId#itemId` ref cannot tell which array its entryId half came
    from. So no two entries across both arrays can share an `id` — not
    just within `entries` alone.

- id: DSDS-05
  name: ITEM_REF_RESOLVES
  enforcement: semantic
  title: An `entryId#itemId` ref must resolve.
  description: >-
    When a `ref`'s `to` uses the `#itemId` form (see
    [common/ref](schema.html#common-ref)), the named entry or
    shared entry must exist in the document. The named item's `id` must
    also exist somewhere in its sections. This is what makes `same-as`
    transclusion off a `base.shared` entry a real, checked connection,
    rather than a string that happens to look right.

- id: DSDS-06
  name: COMPOSES_CYCLE
  enforcement: semantic
  title: A `composes` ref chain must not cycle.
  description: >-
    Following every `rel: composes` ref from entry to entry must never lead
    back to an entry already in the chain. A composition graph with a cycle
    has no well-defined "what is this built from" answer.

- id: DSDS-07
  name: DEPENDS_ON_CYCLE
  enforcement: semantic
  title: A `depends-on` ref chain must not cycle.
  description: >-
    Following every `rel: depends-on` ref from entry to entry must never
    lead back to an entry already in the chain, for the same reason a
    `composes` cycle is invalid - a dependency graph with a cycle has no
    valid resolution order.

- id: DSDS-08
  name: ENTRY_REF_RESOLVES
  enforcement: semantic
  title: A bare `to:` ref must resolve to a real entry or shared entry.
  description: >-
    When a `ref`'s `to` is a bare id (no `#itemId`), the entry or shared
    entry it names must exist - `entries` and `shared` share one id space
    (see `DSDS-04`). Resolves against the whole project, not just the one
    document handed to the validator: a `rel: file` link is followed
    transitively, and every file passed to one CLI invocation is treated
    as belonging to the same project. A target still not found this way
    reports as a warning, not a hard error, unless nothing wider was
    available to check against at all.

- id: DSDS-09
  name: COMBO_TARGET_RESOLVES
  enforcement: semantic
  title: A `combo`'s `subject`/`items` must resolve.
  description: >-
    A `combo` target names one of three things: a trait on the same
    entry (a bare id for a boolean trait, `traitId.valueId` for an enum
    value), a token entry wrapped in braces (`{color.action.primary}`),
    or a bare entry id. `subject: size.small` against a component with
    no `size` trait, or a token reference to a token that doesn't exist,
    now fails instead of passing silently. The trait form is always
    checked against the owning entry's own `traits` - that space is
    always fully visible, so it's a hard error unconditionally. The
    token and entry forms follow the same project-scope search
    `DSDS-05`/`DSDS-08` use, with the same warning-not-error treatment
    when the search is incomplete.

- id: DSDS-10
  name: SAME_AS_LEVEL_MATCHES
  enforcement: semantic
  title: A `same-as` item's `level` must match its target's.
  description: >-
    `level` is required on every guidelines item, even one that borrows
    its `statement` from elsewhere via a `same-as` ref - so the
    borrowing site and the shared rule each carry their own copy of
    `level`, with nothing checking the two agree. Whenever the same-as
    target resolves and has its own `level`, this checks they match.

- id: DSDS-11
  name: FILE_REF_EXISTS
  enforcement: semantic
  title: "A relative `sourceFiles[].file`, `source`, or `rel: file` `href` must exist on disk."
  description: >-
    A relative path in `sourceFiles[].file` (component), `source` (token),
    or any `rel: file` `href` elsewhere should point at a real file - a
    typo'd or stale path silently breaks the promise those fields make
    (that a tool can extract an API, or read a DTCG source, straight from
    what's named there). Checked relative to the directory of the file
    being validated, the same boundary `DSDS-05`/`DSDS-08`/`DSDS-09`'s
    project-scope search uses - a path resolving outside that boundary, or
    with a URL scheme (`https:`, `npm:`, and similar - not a filesystem
    path at all), isn't evaluated.
  note: >-
    Warning-only, promoted to a failure under `--strict` - same tier as
    `DSDS-05`/`DSDS-08`/`DSDS-09`, and opt-in for the same reason: this is
    the one rule that reads files the validator otherwise has no reason to
    open.

# Advisory rules below start at DSDS-12, after DSDS-11 above.

- id: DSDS-12
  name: rfc-keywords-lowercase-in-normative-prose
  enforcement: advisory
  title: Capitalize RFC 2119 keywords (MUST/SHOULD) in a guideline's own statement.
  description: >-
    A guideline `statement` using lowercase "must" or "should" reads as
    ordinary prose instead of a normative rule - capitalizing it makes the
    conformance weight explicit at a glance, the same convention this
    spec's own schema descriptions follow.
  note: >-
    Ported from origin/0.16.0's scripts/lint-docs.js, adapted to check
    sections[].items[].statement instead of the pre-0.20.0
    documentBlocks/criteria shape.

- id: DSDS-13
  name: token-description-restates-identifier
  enforcement: advisory
  title: A token `description`, when present, shouldn't just restate its id/name or repeat a raw value.
  description: >-
    A token entry's `description` is optional and meant to stay terse -
    when an author writes one, it should add what the id can't (the
    token's role, or when to use it). A description that only echoes the
    id/name, or restates the raw value the DTCG source already owns,
    reads as documented intent while carrying none.
  note: >-
    Ported from PR #33 (by Cody Clark), originally implemented as
    DSDS-011 against the pre-0.20.0 entity model (`git show 3c805b7`) -
    same algorithm (exact-restatement or bare-value-literal check after
    normalization), re-hosted on a token entry's own id/name/description.
    Deliberately conservative to avoid false positives: a description that
    adds any role or usage information is never flagged.

- id: DSDS-14
  name: guideline-missing-checkedby
  enforcement: advisory
  title: A hard-requirement guideline (must/must-not) with no `checkedBy` at all.
  description: >-
    `checkedBy` says whether a guideline is automated, assisted, or manual
    verification - leaving it out entirely means a tool can't tell if the
    rule is verifiable at all, not just that it isn't verified yet. Only
    flagged for `must`/`must-not` items: a `should`/`may` item not
    declaring how it's checked is a much smaller gap.
  note: >-
    DSDS-03 already blocks the narrower case (`checkedBy: automated`
    with no `checks` ref backing it). This is the advisory sibling for
    the case DSDS-03 can't see - `checkedBy` left out entirely.

- id: DSDS-15
  name: component-missing-when-to-use
  enforcement: advisory
  title: A component entry with no `guidelines` section framed `when-to-use`.
  description: >-
    "When do I use this?" is usually the first question a component's
    documentation needs to answer, before how to use it correctly.
    Flagged when a component has no guidelines section with
    `framing: when-to-use` at all.
  note: >-
    Adapted from origin/0.16.0's "entity-missing-use-cases" (which
    checked for a `documentBlocks` entry of `kind: use-cases`) - 0.20.0
    folds that content into a `guidelines` section instead of a separate
    block kind, so this checks for that section's presence instead.
