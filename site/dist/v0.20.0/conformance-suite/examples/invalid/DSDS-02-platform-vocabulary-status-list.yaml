# expect: DSDS-02
# rejectedBy: semantic
#
# The sibling DSDS-02 fixture pins the `sourceFiles` path. This one pins
# `metadata.status`'s *list* form specifically: a status list exists to name
# one platform per entry, so it is the shape most likely to carry a platform
# value, and it was the one shape the rule missed — the check read
# `.platform` straight off `metadata.status`, which only ever matched the
# single-object form. A document exactly like this one validated clean.
schemaVersion: "0.20.0"
name: Bad Platform Vocabulary (status list)
entries:
  - id: acme-design-system
    kind: system
    name: Acme Design System
    description: The design system as a whole.
    metadata:
      platforms: [react]
  - id: bad-status-list
    kind: component
    name: Bad Status List
    description: Declares a per-platform status list naming a platform absent from the system entry's metadata.platforms.
    metadata:
      status:
        - status: stable
          platform: react
        - status: beta
          platform: vue
