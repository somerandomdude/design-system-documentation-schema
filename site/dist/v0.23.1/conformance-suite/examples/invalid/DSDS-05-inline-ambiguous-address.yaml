# expect: DSDS-05
# rejectedBy: semantic
# errorAt: /entries/0/description
schemaVersion: "0.23.1"
name: Inline Link To An Ambiguous Address
entries:
  - kind: component
    id: button
    name: Button
    description: Triggers an action. Follow [the label rule](dsds:content#write-the-label).
  - kind: entry
    id: content
    name: Content Rules
    description: Two rules whose text makes the same address.
    sections:
      # Neither item has an `id`, so both are addressed by `write-the-label`,
      # made from their text. Neither wins, so the link can't be followed.
      - kind: guidelines
        for: all
        items:
          - level: must
            statement: Write the label.
      - kind: guidelines
        for: agent
        items:
          - level: must
            statement: Write the label!
