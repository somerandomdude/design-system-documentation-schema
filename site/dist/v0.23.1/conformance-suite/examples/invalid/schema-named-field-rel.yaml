kind: component
# rejectedBy: schema
# A pointer in a field named for its kind has no `rel`: the field says it
# (0.22.0). `evidence` holds cites pointers, so a `rel` here is rejected,
# which also stops a field from holding the wrong kind of pointer.
id: bad-named-field-rel
name: Bad Named Field Rel
description: A guideline whose evidence repeats its rel.
sections:
  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Keep the focus ring visible.
        evidence:
          - href: https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
            rel: cites
        checkedBy: manual
