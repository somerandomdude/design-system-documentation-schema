# rejectedBy: schema
# `replacedBy` names a successor, so it only belongs in a deprecated
# status, next to the deprecation notice. A stable entry naming one is
# rejected by the schema itself.
id: bad-replaced-by
name: Bad Replaced By
description: A stable component that names a successor.
metadata:
  status:
    status: stable
    replacedBy:
      - to: button
