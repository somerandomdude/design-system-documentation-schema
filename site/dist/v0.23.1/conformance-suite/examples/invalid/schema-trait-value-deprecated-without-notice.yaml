kind: component
# rejectedBy: schema
# A trait value can be deprecated on its own (0.22.0). It takes the same
# status shape as an entry, so `status: deprecated` still needs a
# `deprecationNotice` saying what to use instead.
id: bad-deprecated-value
name: Bad Deprecated Value
description: A component with a deprecated trait value and no notice.
traits:
  - traitType: variant
    kind: enum
    id: variant
    description: Which visual style to render.
    values:
      - id: primary
        description: The main style.
      - id: ghost
        description: Borderless style.
        status:
          status: deprecated
