# Two section kinds this example used to demonstrate are gone, replaced by
# things that already existed:
#   - principles -> a guidelines section titled "Principles", carrying only
#     `freeform` content (a principle was a title plus a paragraph, which
#     is exactly a freeform entry) - there's no dedicated `freeform` kind
#     any more, so a section that's nothing but freeform prose just picks
#     whichever kind it's most substantively about (see section.schema.yaml's
#     own $comment).
#   - scale -> a ref to one token in the `space` group. There's no
#     `token-group` kind to point at as a single unit (see
#     metadata.group's own $comment) - a spacing scale composes from the
#     individual tokens that share `metadata.group: space` instead.
#     Step order, resolved values, and per-step usage notes live on the
#     tokens themselves, not duplicated here. See space-4.yaml for one.
id: spacing-scale
kind: entry
name: Spacing Scale
description: The base numeric scale all spacing and sizing tokens derive from.

metadata:
  status: {status: stable}
  since: 1.0.0
  tags: [layout]

refs:
  - to: space-4
    rel: composes
    note: "One step on the `space` scale - every token with `metadata.group` set to \"space\" is a step on this same scale. Step order, resolved values, and per-step usage notes are documented on the tokens, not duplicated here."

sections:
  - kind: guidelines
    for: all
    title: Principles
    freeform:
      - title: 4px base unit
        body: Every spacing value is a multiple of the 4px base unit.
      - title: Steps over arbitrary values
        body: Prefer scale steps over arbitrary pixel values in component styles.
