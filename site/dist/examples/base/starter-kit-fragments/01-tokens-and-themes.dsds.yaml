entries:
  - id: color.action.primary
    kind: token
    name: Action Primary
    description: The fill color for high-emphasis interactive surfaces.
    tokenType: color
    metadata:
      status: {status: stable}
      tags: [color]

  - id: light
    kind: theme
    name: Light
    description: The default theme - standard luminance for well-lit surfaces.
    colorScheme: light
    metadata:
      status: {status: stable}
    refs:
      - href: tokens/light.tokens.json
        rel: file
        note: DTCG source for this theme's own token values.

  - id: dark
    kind: theme
    name: Dark
    description: Inverted-luminance theme for low-light surfaces and user preference.
    colorScheme: dark
    metadata:
      status: {status: stable}
    refs:
      - to: light
        rel: extends
      - href: tokens/dark.tokens.json
        rel: file
        note: DTCG source for this theme's token overrides - the specific tokens that differ from `light` are whichever this file redeclares.
