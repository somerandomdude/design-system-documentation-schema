# expect: DSDS-05
# rejectedBy: semantic
schemaVersion: "0.20.0"
name: Bad Item Ref
entries:
  - id: consumer
    kind: component
    name: Consumer
    description: Points at an item that doesn't exist on shared-thing.
    sections:
      - kind: guidelines
        for: all
        items:
          - level: must
            refs:
              - to: shared-thing#nonexistent-item
                rel: same-as
shared:
  - id: shared-thing
    name: Shared Thing
    description: Holds one real item, for contrast.
    sections:
      - kind: guidelines
        for: all
        items:
          - id: real-item
            statement: A real rule.
            level: must
