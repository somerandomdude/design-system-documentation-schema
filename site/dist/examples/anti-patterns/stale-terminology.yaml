# Valid but wrong: DSDS has no `token-group` entry kind - a group is
# `metadata.group` on the tokens themselves (see
# metadata/entry-metadata.schema.yaml). Nothing in the schema can catch
# prose that names a concept the spec doesn't have; `body` is just
# markdown, so this validates cleanly while pointing a reader at
# something that was never real to begin with.
id: color-tokens
kind: entry
name: Color Tokens
description: How this system's color tokens are organized.
sections:
  - kind: section
    for: human
    freeform:
      - title: Adding a new color
        body: >-
          Create the token, then add it to its token-group entry so it
          shows up in the right category on the tokens page.
