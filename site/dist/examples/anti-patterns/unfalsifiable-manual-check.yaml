# Valid but wrong: `checkedBy: manual` needs no `checks` ref (unlike
# `automated`, which DSDS-03 requires one for), so nothing stops the
# statement itself from being too vague for any reviewer to actually
# pass or fail against. This validates cleanly and still can't be
# checked by the person it names to check it.
id: card
kind: component
name: Card
description: A container for a related group of content and actions.
sections:
  - kind: guidelines
    for: human
    items:
      - statement: Card should look good on all screen sizes.
        level: should
        checkedBy: manual
