id: color.action.primary
kind: token
name: Action Primary
description: Background color for primary action surfaces — the one action we most want the user to take on a screen. The value itself lives in the DTCG file that `source` points to; this document only carries the meaning and usage rules around it.
tokenType: color
source: ./color-action-primary.tokens.json

sections:
  - kind: guidelines
    for: all
    items:
      - statement: Use for at most one action per surface — two competing primary actions split the user's attention and dilute the visual hierarchy the color exists to create.
        level: should
