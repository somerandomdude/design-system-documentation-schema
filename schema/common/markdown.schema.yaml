$schema: https://json-schema.org/draft/2020-12/schema
$id: https://designsystemdocspec.org/v0.23.1/common/markdown.schema.yaml
title: Markdown
type: string
description: >-
  Prose written in CommonMark, with GFM tables and fenced code blocks
  allowed. It can link to something in the project with a `dsds:` link,
  whose target is any string a `to` field accepts.
$comment: >-
  Two forms, both standard CommonMark, so any Markdown parser finds them:
  `[focus visible](dsds:shared-a11y#focus-visible)` with your own text,
  and `<dsds:button>`, whose text a consumer fills in from the target
  (processing model, section 2.4). The target is checked like a `to`:
  DSDS-08 for the entry, DSDS-05 for the part after `#`. An inline link
  is not a relationship. It doesn't count as `uses` or `relates-to`, and
  doesn't appear when a consumer reads relationships backwards. Use a
  pointer field for a relationship, and an inline link to mention
  something in a sentence.

  A JSON Schema can't see inside a string, so nothing here checks the
  links: a validator does. For a real code sample, prefer pointing a
  `ref` at a file instead of embedding one here.
example: "Use for the single primary action on a surface. For navigation, use <dsds:link>."
