# `site/dist/` is committed to the repo (not gitignored), so Netlify could
# in principle just serve it as-is with no build step - but that means every
# change ships only if someone remembers to run `npm run build` and commit
# the result before pushing, with no safety net if they don't. This runs
# the real build on every deploy instead, so the published site always
# matches the source that produced it. `npm run build` itself triggers
# `prebuild` (sync-examples, bundle, og:generate) via npm's own lifecycle
# hooks - nothing extra to chain here.
#
# `base` is explicit on purpose, even though "." is the default when no
# base is configured at all: a stale "Base directory" saved in the Netlify
# site's own dashboard settings (from before this [build] block existed)
# otherwise still wins whenever netlify.toml doesn't declare one itself,
# and `publish` below resolves relative to *that* - a leftover
# dashboard value of "site/dist" plus this file's own "site/dist" was
# exactly how a real deploy once resolved a publish path of
# "site/dist/site/dist". Declaring `base` here isn't optional cleanup;
# it's what makes this file's command/publish win outright, regardless of
# whatever the dashboard still has saved. There's no real package.json or
# build script under site/ to run from either way - the one at
# site/package.json is an unrelated stub (`"type": "commonjs"`, for the
# component files), not this project's build.
#
# `npx playwright install chromium` runs explicitly here too, not just via
# package.json's own `postinstall` hook - og:generate (part of `npm run
# build`'s own `prebuild` step) and axe-audit.mjs both launch a real
# Chromium via Playwright, and only `postinstall` downloading it once,
# during `npm install`, isn't reliable proof against every way a CI
# environment can restore/cache node_modules without re-running install
# lifecycle scripts. Explicit here means the binary is guaranteed present
# by the time `npm run build` actually needs it, regardless of that.
[build]
  base = "."
  command = "npx playwright install chromium && npm run build"
  publish = "site/dist"

# Correct Content-Types for agent/machine-readable artifacts

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/AGENTS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# The bundled schema lives under /v<version>/…; glob covers every version dir.
# Versions through v0.15.2 published a JSON bundle and stay JSON, frozen -
# this rule still applies to them. v0.20.0 onward publishes YAML instead
# (see scripts/bundle.js's own comment for why); the second rule below
# covers those.
[[headers]]
  for = "/v*/*.schema.json"
  [headers.values]
    Content-Type = "application/schema+json; charset=utf-8"

[[headers]]
  for = "/v*/dsds.bundled.yaml"
  [headers.values]
    Content-Type = "application/schema+yaml; charset=utf-8"

# A bare version root (ex: /v0.20.0, no trailing path) has no file of its own —
# send it to the bundled schema for that version. Split schema files under
# /v<version>/… (ex: /v0.15.2/common/criterion.schema.json) are real files on
# disk, so they're served directly and never reach this rule.
#
# Targets .yaml, correct for v0.20.0 onward. A bare-root visit to an older,
# JSON-only version (ex: /v0.15.2 with no filename) will 404 here rather
# than resolve - a real gap, but a convenience path nothing in this repo's
# own docs/skills/manifest actually relies on (they all link the full
# filename directly). Not fixed: Netlify redirects can't branch on which
# file exists at the target, only on the request path, so one static rule
# can't serve both extensions correctly.
[[redirects]]
  from = "/v*"
  to = "/v:splat/dsds.bundled.yaml"
  status = 301
