schemaVersion: "0.20.0"

name: DSDS Site Components

entries:
  - id: dsds-site-components
    kind: system
    name: DSDS Site Components
    description: A lightweight DSDS regression corpus documenting the web components that render the DSDS spec site itself (site/components/).
    metadata:
      status: {status: stable}

# Each component below is its own standalone entry, in its own sibling
# file — not inlined here — so the corpus stays one file per component
# (git history, per-component review) the way it always has. `rel: file`
# is the sanctioned way to point at a sibling document that owns another
# entry in this same system (see base.schema.yaml's own $comment).
refs:
  - href: ./components/back-to-top.dsds.yaml
    rel: file
    role: BackToTop component
  - href: ./components/badge.dsds.yaml
    rel: file
    role: Badge component
  - href: ./components/callout.dsds.yaml
    rel: file
    role: Callout component
  - href: ./components/code.dsds.yaml
    rel: file
    role: Code component
  - href: ./components/cross-refs.dsds.yaml
    rel: file
    role: CrossRefs component
  - href: ./components/def-section.dsds.yaml
    rel: file
    role: DefSection component
  - href: ./components/guide-section.dsds.yaml
    rel: file
    role: GuideSection component
  - href: ./components/header.dsds.yaml
    rel: file
    role: Header component
  - href: ./components/heading.dsds.yaml
    rel: file
    role: Heading component
  - href: ./components/icon-button.dsds.yaml
    rel: file
    role: IconButton component
  - href: ./components/json-view.dsds.yaml
    rel: file
    role: JsonView component
  - href: ./components/logo.dsds.yaml
    rel: file
    role: Logo component
  - href: ./components/prop-list.dsds.yaml
    rel: file
    role: PropList component
  - href: ./components/spec-nav.dsds.yaml
    rel: file
    role: SpecNav component
  - href: ./components/table.dsds.yaml
    rel: file
    role: Table component
  - href: ./components/tag.dsds.yaml
    rel: file
    role: Tag component
  - href: ./components/type-ref.dsds.yaml
    rel: file
    role: TypeRef component
