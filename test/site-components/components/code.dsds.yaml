id: code
kind: component
name: Code
description: A syntax-highlighted code block (or inline code span), highlighted via the CSS Custom Highlight API — the raw text stays one untouched text node, so nothing is ever wrapped in spans or escaped through innerHTML.

metadata:
  status: {status: stable}
  tags: [content, code]

traits:
  - kind: boolean
    id: inline
    description: Renders as an inline `<code>` span instead of a block, for short code references inside a sentence.
    setBy: consumer
  - kind: boolean
    id: wrap
    description: Wraps long lines (white-space:pre-wrap) instead of the default horizontal-scrolling single-line-per-line layout.
    setBy: consumer

sourceFiles:
  - platform: web-component
    file: ../../../site/components/code.js

imports:
  - platform: web-component
    code: '<ds-code language="yaml">schemaVersion: "0.20.0"</ds-code>'

refs:
  - to: header
    rel: part-of
    note: Rendered inline for the "Source:" line and for backtick spans in a header's description.
  - to: guide-section
    rel: part-of
    note: Slotted into "example" as the right-hand column's worked example.
  - to: def-section
    rel: part-of
    note: Slotted into "example" on a layout=split definition.

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - statement: Set language="json" or language="yaml" on any code sample containing structured data, so the tokenizer highlights it — plain text otherwise renders unhighlighted, which still works but reads worse.
        level: should
        checkedBy: manual
      - statement: This component requires the CSS Custom Highlight API (Chrome 105+, Safari 17.2+, Firefox 140+) and has no fallback path for older browsers — do not add a second highlighting mechanism to "cover" them.
        level: must-not
        checkedBy: manual

  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - statement: Use for anything meant to be read or copied as code — commands, config, API examples. Use inline for a short reference inside a sentence; use block (the default) for a standalone sample.
        level: should
        checkedBy: manual
